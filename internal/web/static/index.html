<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>loghorn</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/app.css">
<script type="module" src="/static/app.js"></script>
</head>
<body>
<header class="top">
  <div class="top-left">
    <button id="sb-toggle" class="sb-toggle" type="button" aria-controls="sidebar" aria-expanded="true" title="hide the controls">◀</button>
    <h1 id="title">loghorn</h1>
  </div>
  <div class="menu-wrap">
    <button id="fav-button" type="button" aria-haspopup="true" aria-expanded="false">Favorites ▾</button>
    <div id="fav-menu" class="menu" hidden>
      <ul id="fav-list" class="fav-list"></ul>
      <p id="fav-status" class="status"></p>
      <button id="fav-save-menu" type="button">Save as favorite</button>
    </div>
  </div>
</header>
<div id="error" class="banner" role="alert" hidden></div>
<p id="empty" class="empty" hidden>No labelled records yet — lines need a labels.schema</p>
<div class="layout">
<aside id="sidebar" class="sidebar">
  <section id="sb-view" class="sb tabs" role="tablist" aria-label="view">
    <button type="button" class="tab" role="tab" data-view="samples">Samples</button>
    <button type="button" class="tab" role="tab" data-view="table">Table</button>
    <button type="button" class="tab" role="tab" data-view="graph">Graph</button>
  </section>
  <div class="sb-form">
    <div id="sb-mode" class="sb-field">
      <span class="sb-l" id="sb-mode-label">Mode</span>
      <div class="sb-body tabs" role="group" aria-labelledby="sb-mode-label">
        <button type="button" class="tab" data-source="log">Logs</button>
        <button type="button" class="tab" data-source="otel">Spans</button>
      </div>
    </div>
    <div id="sb-service" class="sb-field">
      <label class="sb-l" for="service">Service</label>
      <div class="sb-body"><select id="service"></select></div>
    </div>
    <div id="sb-stream" class="sb-field">
      <span class="sb-l" id="sb-stream-label">Stream</span>
      <div class="sb-body">
        <div id="kind-list" class="kind-list" role="listbox" aria-labelledby="sb-stream-label"></div>
        <button id="kind-more" type="button" class="link kind-more" hidden>More ▸</button>
        <input id="kind-filter" type="search" placeholder="filter kinds" aria-label="filter kinds" hidden>
      </div>
    </div>
    <div id="sb-from" class="sb-field">
      <label class="sb-l" for="from">From</label>
      <div class="sb-body">
        <select id="from">
          <option value="this-run">this run</option>
          <option value="15m">last 15m</option>
          <option value="1h">last 1h</option>
          <option value="24h">last 24h</option>
          <option value="all">all</option>
          <option value="custom">custom…</option>
        </select>
        <input id="from-custom" type="datetime-local" step="0.001" aria-label="from time" hidden>
      </div>
    </div>
    <div id="sb-to" class="sb-field">
      <label class="sb-l" for="to">To</label>
      <div class="sb-body">
        <select id="to">
          <option value="now">now</option>
          <option value="custom">custom…</option>
        </select>
        <input id="to-custom" type="datetime-local" step="0.001" aria-label="to time" hidden>
      </div>
    </div>
    <div id="sb-group" class="sb-field" data-views="table graph">
      <span class="sb-l" id="sb-group-label">Group by</span>
      <div id="sb-group-body" class="sb-body" role="group" aria-labelledby="sb-group-label"></div>
    </div>
    <div id="sb-order" class="sb-field" data-views="table graph">
      <span class="sb-l" id="sb-order-label">Order by</span>
      <div id="sb-order-body" class="sb-body" role="group" aria-labelledby="sb-order-label"></div>
    </div>
    <div id="sb-metrics" class="sb-field" data-views="table graph">
      <span class="sb-l" id="sb-metrics-label">Metrics</span>
      <div id="sb-metrics-body" class="sb-body" role="group" aria-labelledby="sb-metrics-label"></div>
    </div>
    <div id="sb-top" class="sb-field" data-views="table graph">
      <label class="sb-l" for="top">Top</label>
      <div id="sb-top-body" class="sb-body"></div>
    </div>
    <div id="sb-plot" class="sb-field" data-views="graph">
      <span class="sb-l" id="sb-plot-label">Plot</span>
      <div id="sb-plot-body" class="sb-body" role="group" aria-labelledby="sb-plot-label"></div>
    </div>
    <div id="sb-chart" class="sb-field" data-views="graph">
      <label class="sb-l" for="chart">Chart</label>
      <div id="sb-chart-body" class="sb-body"></div>
    </div>
    <div id="sb-bucket" class="sb-field" data-views="graph">
      <span class="sb-l" id="sb-bucket-label">Granularity</span>
      <div id="sb-bucket-body" class="sb-body" role="group" aria-labelledby="sb-bucket-label"></div>
    </div>
  </div>
  <section id="sb-filters" class="sb">
    <h2>Filters</h2>
    <div id="triples" class="triples"></div>
    <datalist id="field-paths"></datalist>
  </section>
  <section id="sb-columns" class="sb" data-views="samples">
    <h2>Columns</h2>
    <div id="columns" class="sb-row">
      <span id="colnames" class="colnames"></span>
    </div>
    <div class="sb-row">
      <button id="col-az" type="button" title="order the columns by their last name part, A to Z; timestamp stays first">A→Z</button>
      <button id="col-all" type="button" title="add every field of the stream as a column">show all</button>
      <button id="col-restore" type="button" title="show the stream's default columns" hidden>restore defaults</button>
    </div>
  </section>
</aside>
<div class="content">
<form id="bar" class="bar" autocomplete="off">
  <label class="grow">Search <input id="search" type="search" placeholder="text in any field; Enter to run"></label>
  <button id="refresh" type="button">Refresh</button>
</form>
<main id="results">
  <table id="table">
    <thead><tr id="head"></tr></thead>
    <tbody id="body"></tbody>
  </table>
  <div id="graph" hidden></div>
</main>
<footer id="footer" class="footer">
  <span id="footer-text"></span>
  <span class="footer-actions">
    <button id="fav-save" type="button">Save as favorite</button>
    <button id="schema-open" type="button">Schema…</button>
  </span>
</footer>
<section id="trace" class="trace" aria-label="trace waterfall" hidden>
  <div class="trace-top">
    <div id="trace-head" class="trace-head"></div>
    <div id="trace-tools" class="trace-tools">
      <button id="trace-close" type="button" title="back to the table (Esc)">Close</button>
      <button id="trace-reload" type="button" title="fetch this trace again">Reload</button>
      <button id="trace-collapse" type="button" title="collapse every span with children">Collapse all</button>
      <button id="trace-expand" type="button" title="expand every span">Expand all</button>
    </div>
  </div>
  <div id="trace-legend" class="trace-legend"></div>
  <div id="trace-grid" class="trace-grid">
    <div id="trace-axis" class="trace-axis"></div>
    <div id="trace-rows" class="trace-rows"></div>
  </div>
  <div id="trace-detail" class="detail trace-detail"></div>
  <div id="trace-self" class="trace-self"></div>
</section>
</div>
</div>
<dialog id="schema-dialog" class="schema-dialog">
  <h2 id="schema-title">Schema</h2>
  <div class="schema-scroll">
    <table id="schema-table" class="schema-table">
      <thead><tr><th>path</th><th>inferred</th><th>type</th><th>unit</th><th>visualizer</th><th>label</th><th>hidden</th><th>count</th><th></th></tr></thead>
      <tbody id="schema-body"></tbody>
    </table>
  </div>
  <p id="schema-status" class="status" role="status"></p>
  <div class="panel-actions">
    <button id="schema-save" type="button">Save schema</button>
    <button id="schema-close" type="button" class="link">close</button>
  </div>
</dialog>
<div id="col-menu" class="menu col-menu" hidden></div>
<div id="col-sub" class="menu col-menu col-sub" hidden></div>
</body>
</html>
